name = "webabc-ir"
compatibility_date = "2026-07-20"
main = "worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the worker for every request (not only asset-misses). This lets worker.ts
# own URL normalization: trailing-slash requests answer with a permanent 301
# instead of the assets layer's temporary 307, and `/` gets the server-side
# geo-based locale redirect instead of the JS shim page.
run_worker_first = true
