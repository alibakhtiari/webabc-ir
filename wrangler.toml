name = "webabc-ir"
compatibility_date = "2026-07-20"
main = "worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the worker for every request (not only asset-misses). This lets worker.ts
# own URL normalization: trailing-slash requests answer with a permanent 301
# instead of the assets layer's temporary 307, and `/` gets the server-side
# geo-based locale redirect instead of the JS shim page.
run_worker_first = true
# Without this, unmatched paths return 404 with an EMPTY body under
# run_worker_first: the assets layer never falls back to dist/404.html, so
# worker.ts was passing a zero-byte page through to real browsers (bots still
# got the markdown recovery body). worker.ts swaps in /{lang}/404/ for
# locale-prefixed paths, so this root document is only the fallback.
# Value is the semantic mode, not a filename: "404-page" makes the assets
# layer serve dist/404.html with a 404 status. "404.html" is not a valid
# mode and wrangler rejects the config outright.
not_found_handling = "404-page"
